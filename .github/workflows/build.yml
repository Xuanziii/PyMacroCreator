name: Build Windows Executable

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build PyMacroCreator.exe with PyInstaller
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name PyMacroCreator --collect-all customtkinter --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32 --hidden-import PIL._tkinter_finder pulovers_macro_creator.py

      - name: Upload PyMacroCreator.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyMacroCreator-Windows-x64
          path: dist/PyMacroCreator.exe
          retention-days: 30

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PyMacroCreator.exe
          generate_release_notes: true
